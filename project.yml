name: ZCode
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  ZCodeKit:
    path: Packages/ZCodeKit
targets:
  ZCode:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/KaTeX"
          - "Resources/KaTeX/**"
      # KaTeX 0.16.45 (lot 13G) : référence de dossier, copié avec son arborescence (`fonts/`).
      - path: App/Resources/KaTeX
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZCodeKit
        product: ZCodeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZCODE_BUNDLE_ID_PREFIX).zcode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZCode
        INFOPLIST_KEY_NSCameraUsageDescription: "Prendre une photo à joindre à un message pour ZCode."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - ZCodeAppTests
        - ZCodeUITests
  ZCodeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: ZCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZCODE_BUNDLE_ID_PREFIX).zcode.tests
        GENERATE_INFOPLIST_FILE: YES
  ZCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: ZCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZCODE_BUNDLE_ID_PREFIX).zcode.uitests
        GENERATE_INFOPLIST_FILE: YES
